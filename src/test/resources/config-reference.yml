# Foliate configuration.

# The plugin rewrites this file when it adds new settings: your values are kept,
# but comments you add and settings it does not know are removed.
# Write true or false for on/off settings.

# Internal version of this file, used to migrate it when the plugin updates.
# Do not edit.
config-version: 1
# Scoreboard shown on the right of each player's screen.
scoreboard:
  enabled: true
  # Ticks between two refreshes (20 ticks = 1 second).
  refresh-ticks: 20
  # Title and lines use the MiniMessage format.
  # Available tags: <player>, <online>, and <papi:placeholder> when PlaceholderAPI is installed,
  # for example <papi:foliate_joins>.
  title: <aqua><bold>Foliate
  lines:
  - ''
  - '<gray>Player: <white><player>'
  - '<gray>Online: <white><online>'
  - ''
# Where player data is kept.
# Changes in this section only apply after a server restart.
storage:
  # Set to false to run without a database. Features that need one are then turned off.
  enabled: true
  # SQLITE keeps everything in a file in this folder and needs no setup.
  # MYSQL connects to a MySQL or MariaDB server, using the settings below.
  type: SQLITE
  mysql:
    host: localhost
    port: 3306
    database: foliate
    username: foliate
    password: ''
    # Maximum number of connections kept open.
    pool-size: 4
    # Options passed to the database driver as they are, for instance:
    #   sslMode: REQUIRED
    #   connectionTimeZone: UTC
    # connectTimeout and socketTimeout default to 10000 and 30000 (milliseconds).
    # See the MySQL Connector/J documentation for the full list.
    properties: {}
