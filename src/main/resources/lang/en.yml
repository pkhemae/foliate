# Messages use the MiniMessage format: https://docs.papermc.io/adventure/minimessage/format/
# <prefix> inserts the prefix below. Set a message to "" to disable it.
# A message missing from this file falls back to the plugin's built-in text.

prefix: "<dark_gray>[<aqua>Foliate</aqua>]</dark_gray> "

command:
  info:
    - "<prefix><white>Foliate <aqua><version></aqua>"
    - "<gray>Platform: <white><platform>"
    - "<gray>Modules: <white><modules>"
  reload:
    started: "<prefix><gray>Reloading..."
    success: "<prefix><green>Everything was reloaded."
    failure: "<prefix><red>Could not reload <white><module></white>: <error>"
    unexpected: "<prefix><red>Could not reload <white><module></white> because of an unexpected error. See the console."
    error: "<prefix><red>The reload failed unexpectedly. See the console."
  profile:
    show:
      - "<prefix><white><player></white>"
      - "<gray>First seen: <white><first-seen>"
      - "<gray>Online since: <white><since>"
      - "<gray>Joins: <white><joins>"
    name-required: "<prefix><red>Name a player: <white>/foliate profile \\<player></white>"
    unknown: "<prefix><red><white><player></white> is not online."
    not-loaded: "<prefix><red>The profile of <white><player></white> is not loaded yet."
    others-denied: "<prefix><red>You may not see another player's profile."
  menu:
    player-required: "<prefix><red>Only a player can open a menu: <white>/execute as \\<player> run foliate menu</white>"

menu:
  unknown: "<prefix><red>The menu <white><menu></white> does not exist."
  unavailable: "<prefix><red>Menus are not available right now."

profile:
  load-failed: "<red>Your data could not be loaded. Please try again in a moment."
