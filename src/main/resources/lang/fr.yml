# Les messages utilisent le format MiniMessage : https://docs.papermc.io/adventure/minimessage/format/
# <prefix> insère le préfixe ci-dessous. Mettez "" pour désactiver un message.
# Un message absent de ce fichier reprend le texte intégré au plugin.

prefix: "<dark_gray>[<aqua>Foliate</aqua>]</dark_gray> "

command:
  info:
    - "<prefix><white>Foliate <aqua><version></aqua>"
    - "<gray>Plateforme : <white><platform>"
    - "<gray>Modules : <white><modules>"
  reload:
    started: "<prefix><gray>Rechargement..."
    success: "<prefix><green>Tout a été rechargé."
    failure: "<prefix><red>Impossible de recharger <white><module></white> : <error>"
    unexpected: "<prefix><red>Impossible de recharger <white><module></white> à cause d'une erreur inattendue. Consultez la console."
    error: "<prefix><red>Le rechargement a échoué de manière inattendue. Consultez la console."
  profile:
    show:
      - "<prefix><white><player></white>"
      - "<gray>Première connexion : <white><first-seen>"
      - "<gray>En ligne depuis : <white><since>"
      - "<gray>Connexions : <white><joins>"
    name-required: "<prefix><red>Indiquez un joueur : <white>/foliate profile \\<joueur></white>"
    unknown: "<prefix><red><white><player></white> n'est pas en ligne."
    not-loaded: "<prefix><red>Le profil de <white><player></white> n'est pas encore chargé."
    others-denied: "<prefix><red>Vous ne pouvez pas voir le profil d'un autre joueur."

menu:
  unknown: "<prefix><red>Le menu <white><menu></white> n'existe pas."
  unavailable: "<prefix><red>Les menus ne sont pas disponibles pour le moment."

profile:
  load-failed: "<red>Vos données n'ont pas pu être chargées. Réessayez dans un instant."
