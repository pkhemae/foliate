name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error

  # Unit tests run on one thread and cannot see region violations: this boots a real Folia server
  # and lets the plugin test itself, with and without the optional plugins it integrates with.
  smoke-test:
    name: Folia smoke test (hooks ${{ matrix.hooks }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        hooks: [true, false]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # -PacceptEula=true accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for this throwaway
      # server. Remove this job if you do not agree to it.
      - name: Start Folia and run the self-test
        # A run takes about a minute. If the plugin could not even be loaded nothing stops the
        # server, so this is what ends the step.
        timeout-minutes: 5
        run: ./gradlew runFolia -PselfTest=true -PacceptEula=true -Phooks=${{ matrix.hooks }} < /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: server-log-hooks-${{ matrix.hooks }}
          path: run/logs/latest.log
