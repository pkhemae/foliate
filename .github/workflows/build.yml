name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error

  # Unit tests run on one thread and cannot see region violations: this boots a real Folia server
  # and lets the plugin test itself, with and without the optional plugins it integrates with.
  smoke-test:
    name: Folia smoke test (hooks ${{ matrix.hooks }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        hooks: [true, false]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # -PacceptEula=true accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for this throwaway
      # server. Remove this job if you do not agree to it.
      - name: Start Folia and run the self-test
        # A run takes about a minute. If the plugin could not even be loaded nothing stops the
        # server, so this is what ends the step.
        timeout-minutes: 5
        run: ./gradlew runFolia -PselfTest=true -PacceptEula=true -Phooks=${{ matrix.hooks }} < /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: server-log-hooks-${{ matrix.hooks }}
          path: run/logs/latest.log

  # The smoke test connects nobody. This one joins the test server with a real Minecraft client,
  # run headlessly by HeadlessMC (https://github.com/headlesshq/headlessmc, MIT) with an offline
  # account, which is only allowed in CI. The plugin's self-test then checks what the player got:
  # a scoreboard, a saved profile, an open menu, a connection that holds, a player who comes back, and
  # the messages of their language.
  client-test:
    name: Folia test with a connected client (hooks ${{ matrix.hooks }}, typed ${{ matrix.typed }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        hooks: [true, false]
        # typed: a Fabric client with hmc-specifics types a command, instead of only joining.
        typed: [false, true]
        exclude:
          - hooks: false
            typed: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.minecraft
          # The client downloaded for the Minecraft version of the build.
          key: minecraft-client-${{ matrix.typed }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # Downloads the Minecraft client from Mojang and runs the server with -PacceptEula=true:
      # both are subject to the Minecraft EULA (https://aka.ms/MinecraftEULA). Remove this job if
      # you do not agree to it.
      - name: Join the test server with a client
        # Longer than the self-test's own timeout, which gives the verdict.
        timeout-minutes: 20
        env:
          HOOKS: ${{ matrix.hooks }}
          TYPED: ${{ matrix.typed }}
        run: .github/scripts/client-test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: client-test-logs-hooks-${{ matrix.hooks }}-typed-${{ matrix.typed }}
          path: |
            run/logs/latest.log
            server.out
            client-*.out
            client-run/logs/latest.log
            client-run/crash-reports
            HeadlessMC/headlessmc.log
          if-no-files-found: ignore

  # SQLite is what the unit tests use. This runs the profile storage on the servers it is meant to
  # work with, through the same Database and migrations as the plugin.
  database-test:
    name: Storage on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.4", "mariadb:11.4"]
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: throwaway
          MYSQL_DATABASE: foliate_test
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Wait for the database to accept logins
        run: |
          for _ in $(seq 1 60); do
            if mysql -h 127.0.0.1 -P 3306 -u root -pthrowaway -e "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "The database never accepted a login"
          exit 1

      - name: Run the storage tests
        env:
          FOLIATE_TEST_MYSQL_PORT: 3306
          FOLIATE_TEST_MYSQL_PASSWORD: throwaway
        run: ./gradlew test --tests '*ProfileStorageOnMysqlTest'

      # A skipped class would still be a green build: the five tests must have run.
      - name: The tests were not skipped
        run: |
          report=build/test-results/test/TEST-dev.foliate.modules.profile.ProfileStorageOnMysqlTest.xml
          grep -q 'tests="5" skipped="0" failures="0" errors="0"' "$report"

  # The template's promise is that renaming it gives a plugin that builds and passes its tests.
  rename-check:
    name: Rename the template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The task removes itself when it has run, so a plugin made from the template has nothing to
      # check here: its copy of this job then does nothing.
      - name: Is this still the template?
        id: template
        run: |
          if [ -f gradle/rename.gradle.kts ]; then
            echo "still=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename it
        if: steps.template.outputs.still == 'true'
        run: ./gradlew renameTemplate -PnewName=Skylands -PnewGroup=com.example.skylands -PnewRepository=acme/skylands

      - name: Nothing of the template's name is left
        if: steps.template.outputs.still == 'true'
        run: |
          # grep exits 1 when it finds nothing and 2 when it fails: only the first is good news.
          status=0
          grep -rIil "foliate" . --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build || status=$?
          if [ "$status" -eq 0 ]; then
            echo "These files still mention the template's name"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "grep failed with $status"
            exit 1
          fi
          if find . -iname '*foliate*' -not -path './.git/*' -not -path './.gradle/*' -not -path './build/*' | grep .; then
            echo "These files or folders are still named after the template"
            exit 1
          fi

      - name: Build and test the renamed plugin
        if: steps.template.outputs.still == 'true'
        run: ./gradlew build
