name: Release

# Pushing a tag such as v1.2.0 builds the plugin as version 1.2.0 and publishes it as a GitHub
# release. A tag with a suffix, such as v1.2.0-rc.1, is published as a pre-release.
#
# Two jobs, so that the token that can write to the repository never sits next to third-party
# code: "build" runs Gradle, its plugins, a Folia server and plugins from Modrinth with a read-only
# token, and hands the jar over as an artifact; "publish" runs no build tool, and only publishes
# that jar with its checksum.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to check the tag is on main. The token is not left in the git
          # configuration while Gradle runs third-party code.
          fetch-depth: 0
          persist-credentials: false

      # A tag that is not a version, or that was cut from a commit that never went through main,
      # must not become a release.
      - name: Check the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not a version tag such as v1.2.0 or v1.2.0-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The tag is the version: gradle.properties keeps the next snapshot.
      - name: Build and test
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"

      # Same smoke test as CI: what is released has enabled on a real Folia server. The server test
      # jar is the released jar, entry for entry, plus the server test.
      # -PacceptEula=true accepts the Minecraft EULA (https://aka.ms/MinecraftEULA) for this
      # throwaway server.
      - name: Smoke test on Folia
        timeout-minutes: 5
        run: ./gradlew runFolia -Pversion="${GITHUB_REF_NAME#v}" -PserverTest=true -PacceptEula=true < /dev/null

      - name: Set the jar aside
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The installable jar, not the "-plain" one next to it.
          jar=(build/libs/*-"${version}".jar)
          if [ "${#jar[@]}" -ne 1 ] || [ ! -f "${jar[0]}" ]; then
            echo "::error::Expected one jar for ${version} in build/libs, found: ${jar[*]}"
            exit 1
          fi
          mkdir release
          cp "${jar[0]}" release/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jar
          path: release/*.jar
          if-no-files-found: error
          # "Re-run failed jobs" does not rebuild: publish downloads this artifact again. Seven
          # days leave time for that; after them, "Re-run all jobs" builds it anew.
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout and no build tool: the jar built and tested above, checked against the digest
      # recorded when it was uploaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jar
          path: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar=(*-"${version}".jar)
          if [ "${#jar[@]}" -ne 1 ] || [ ! -f "${jar[0]}" ]; then
            echo "::error::Expected one jar for ${version} in the artifact, found: ${jar[*]}"
            exit 1
          fi
          # Checked with: sha256sum -c <jar>.sha256
          sha256sum "${jar[0]}" > "${jar[0]}.sha256"
          files=("${jar[0]}" "${jar[0]}.sha256")
          flags=(--generate-notes --verify-tag)
          case "$version" in
            *-*) flags+=(--prerelease) ;;
          esac
          # A release that already exists for the tag, from an earlier attempt or drafted by hand,
          # gets the files replaced instead of failing here. Re-running only this job needs the
          # build's artifact, which is kept 7 days.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}"
          fi
