[versions]
# The Minecraft line this plugin targets. Changing it means bumping every version marked
# "tied to minecraft" below in the same commit.
minecraft = "26.2"
# Pinned on purpose: Folia lags behind Paper, so compiling against a newer paper-api
# could let through API that the Folia server does not have. Tied to minecraft.
folia-api = "26.2.build.7-beta"

junit = "6.1.3"
# The artifact name (mockbukkit-v26.2) is tied to minecraft too.
mockbukkit = "4.117.0"

shadow = "9.6.1"
run-paper = "3.1.0"
resource-factory = "1.4.0"

[libraries]
folia-api = { module = "dev.folia:folia-api", version.ref = "folia-api" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
resource-factory-bukkit = { id = "xyz.jpenilla.resource-factory-bukkit-convention", version.ref = "resource-factory" }
