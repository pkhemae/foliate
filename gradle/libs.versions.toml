[versions]
# The Minecraft line this plugin targets. Changing it means bumping every version marked
# "tied to minecraft" below in the same commit.
minecraft = "26.2"
# Pinned on purpose: Folia lags behind Paper, so compiling against a newer paper-api
# could let through API that the Folia server does not have. Tied to minecraft.
folia-api = "26.2.build.7-beta"

configlib = "4.8.1"
# The YAML engine ConfigLib reads and writes with. Keep it on the version ConfigLib depends on.
snakeyaml-engine = "2.7"
fastboard = "2.2.2"
hikaricp = "7.1.0"
# Only for tests: the server ships its own SQLite and MySQL drivers.
sqlite-jdbc = "3.49.1.0"
# Only for tests, like sqlite-jdbc: the driver of the MySQL and MariaDB servers the CI starts.
mysql-connector = "26.10.0"
placeholderapi = "2.12.3"
zmenu = "1.1.2.1"

junit = "6.1.3"
# The artifact name (mockbukkit-v26.2) is tied to minecraft too.
mockbukkit = "4.117.0"

shadow = "9.6.1"
run-paper = "3.1.0"
resource-factory = "1.4.0"

[libraries]
folia-api = { module = "dev.folia:folia-api", version.ref = "folia-api" }

placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
zmenu-api = { module = "fr.maxlego08.menu:zmenu-api", version.ref = "zmenu" }
configlib-yaml = { module = "de.exlll:configlib-yaml", version.ref = "configlib" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
fastboard = { module = "fr.mrmicky:fastboard", version.ref = "fastboard" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.2", version.ref = "mockbukkit" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
resource-factory-bukkit = { id = "xyz.jpenilla.resource-factory-bukkit-convention", version.ref = "resource-factory" }
